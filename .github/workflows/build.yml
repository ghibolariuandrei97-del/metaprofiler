name: Build Linux
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install 32-bit compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-multilib

      - name: List files
        run: ls -la

      - name: Build .so
        run: make

      - name: Upload .so
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: metaprofiler-linux
          path: "*.so"
