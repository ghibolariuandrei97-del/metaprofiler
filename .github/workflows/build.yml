name: Build Linux

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install 32-bit compiler
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y g++-multilib

      - name: Build .so
        run: make

      - name: Upload .so
        uses: actions/upload-artifact@v3
        with:
          name: metaprofiler-linux
          path: "*.so"
